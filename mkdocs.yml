site_name: AlegraPy
site_description: Cliente de Python para consumir la API de Alegra de forma sencilla.
site_url: https://camilordz1.github.io/alegrapy/
repo_url: https://github.com/camilordz1/alegrapy
repo_name: camilordz1/alegrapy

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - Inicio: index.md
  - Guías:
      - Instalación: guias/instalacion.md
      - Autenticación: guias/autenticacion.md
      - Guía rápida: guias/guia-rapida.md
      - Recursos: guias/recursos.md
      - Paginación: guias/paginacion.md
      - Búsquedas exactas: guias/busquedas.md
      - Facturas sin duplicados: guias/facturas-sin-duplicados.md
      - Notas crédito y anulación: guias/notas-credito.md
      - Notas débito de cliente: guias/notas-debito.md
      - Compras y proveedor: guias/compras.md
      - Emisión electrónica (DIAN): guias/emision-dian.md
      - Webhooks: guias/webhooks.md
      - Catálogos y remisiones: guias/catalogos.md
      - Ajustes de inventario: guias/inventario.md
      - Numeraciones y empresa: guias/numeraciones-y-empresa.md
      - Archivos de facturas: guias/archivos-de-facturas.md
      - Errores: guias/errores.md
      - Reintentos: guias/reintentos.md
      - Concurrencia: guias/concurrencia.md
      - Seguridad: guias/seguridad.md
      - Migración desde el modo legacy: guias/migracion-legacy.md
      - Versiones y cambios: guias/versiones.md
  - Referencia de la API:
      - Introducción: referencia/index.md
      - Cliente y errores: referencia/session.md
      - Excepciones: referencia/exceptions.md
