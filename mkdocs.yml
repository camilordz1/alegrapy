      - Ítems: referencia/items.md
      - Cotizaciones: referencia/estimates.md
      - Órdenes de compra: referencia/purchase_orders.md
      - Cuentas bancarias: referencia/bank_accounts.md
      - Impuestos: referencia/taxes.md
      - Monedas: referencia/currencies.md
      - Retenciones: referencia/retentions.md
      - Usuarios: referencia/users.md
      - Numeraciones: referencia/number_templates.md
      - Empresa: referencia/company.md
      - Notas débito de cliente: referencia/income_debit_notes.md
      - Webhooks: referencia/webhooks.md
      - Facturas de proveedor: referencia/bills.md
