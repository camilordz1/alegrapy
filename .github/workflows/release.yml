name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - testpypi
          - pypi
        required: true
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build, test, and check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0 twine==6.2.0
          pip install . -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Verify version and CHANGELOG
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          ns = {}
          exec(pathlib.Path("alegrapy/_version.py").read_text(encoding="utf-8"), ns)
          version = ns["__version__"]
          print(f"Package version: {version}")

          event = os.environ["EVENT_NAME"]
          ref_name = os.environ["REF_NAME"]
          target = os.environ.get("DISPATCH_TARGET", "")

          if event == "push":
              tag_version = ref_name.removeprefix("v")
              if tag_version != version:
                  raise SystemExit(
                      f"Tag {ref_name!r} does not match __version__ {version!r}"
                  )

          if event == "push" or target == "pypi":
              changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
              pattern = rf"^## \[{re.escape(version)}\](?:\s|$)"
              if not re.search(pattern, changelog, flags=re.MULTILINE):
                  raise SystemExit(
                      f"CHANGELOG.md has no '## [{version}]' heading"
                  )
          PY
      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*
      - name: Guard archive contents
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import tarfile
          import zipfile

          forbidden_files = {"config.ini", "alegra.log", ".env", "main.py"}
          forbidden_dirs = {"env", "odd", "site", "tests"}

          def check_members(archive, members, strip_root):
              bad = []
              for raw in members:
                  parts = pathlib.PurePosixPath(raw).parts
                  if strip_root and len(parts) > 1:
                      parts = parts[1:]
                  elif strip_root:
                      continue
                  if not parts:
                      continue
                  if parts[0] in forbidden_dirs or any(p in forbidden_files for p in parts):
                      bad.append(raw)
              if bad:
                  raise SystemExit(f"Forbidden entries in {archive}: {bad}")

          for path in sorted(glob.glob("dist/*.tar.gz")):
              with tarfile.open(path, "r:gz") as tf:
                  names = [m.name for m in tf.getmembers()]
              print(f"sdist ({path}): {len(names)} entries")
              check_members(path, names, strip_root=True)

          for path in sorted(glob.glob("dist/*.whl")):
              with zipfile.ZipFile(path) as zf:
                  names = zf.namelist()
              print(f"wheel ({path}): {len(names)} entries")
              check_members(path, names, strip_root=False)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/AlegraPy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/AlegraPy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    needs: publish-pypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["REF_NAME"].removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          notes = match.group(1).strip() if match else ""
          if not notes:
              raise SystemExit(
                  f"No release notes found in CHANGELOG.md for version {version!r}"
              )
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" dist/* \
            --title "$REF_NAME" \
            --notes-file release-notes.md
